source: 'npm registry, PyPI, crates.io, github.com/sifive'
description: >-
  SiFive ships no REST API client SDKs — it has no public REST API. Its first-party
  published libraries are hardware/embedded development artifacts: the DUH (Design Unit
  Hardware) toolchain on npm, all published from github.com/sifive under Apache-2.0 by the
  same npm maintainer set (drom, albertpchen, rxia); the Freedom SDKs distributed as
  source and release archives from the sifive GitHub organization rather than a package
  registry; and pydevicetree on PyPI. Third-party packages that merely carry the SiFive
  name (the @sifive/* xPacks, published by micro-os-plus, and the sifive-* Rust crates) are
  listed separately and marked official:false.
