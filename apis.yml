aid: sifive
name: SiFive
description: 'SiFive is a semiconductor intellectual-property company founded by the
  creators of the RISC-V instruction set architecture at UC Berkeley — Krste Asanovic,
  Yunsup Lee and Andrew Waterman — and licenses configurable RISC-V processor core IP
  rather than manufacturing chips. Its catalog spans the Essential (E/S/U), Performance
  (P500/P600/P800), Intelligence (X100/X200/X300/XM) and Automotive (E6-A/E7-A/S7-A)
  core families plus system IP including SiFive Insight trace and debug, IOMMU Gen 2,
  Shield and WorldGuard. Customers configure a Core Design and generate a downloadable
  Dev Kit of RTL, testbench, software and documentation through SiFive Core Designer,
  delivered from the SiFive Cloud Services (SCS) portal at scs.sifive.com. The public
  developer surface is software tooling rather than a hosted REST API: the Freedom SDK
  for Metal and for Linux, Freedom Studio, Freedom Tools, the SiFive Kernel Library
  and the open-source DUH hardware-IP description toolchain and JSON Schema published
  on npm and GitHub.'
