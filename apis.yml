apis:
- aid: sifive-cloud-services-oauth
  name: SiFive Cloud Services OAuth 2.0
  description: 'The OAuth 2.0 authorization server that fronts the SiFive Cloud Services
    (SCS) portal at scs.sifive.com, where SiFive Core Designer and the rest of the
    SiFive development tooling are delivered. It publishes RFC 8414 authorization
    server metadata anonymously at /.well-known/oauth-authorization-server, supports
    the authorization_code and refresh_token grants with PKCE (S256), exposes token,
    introspection, revocation, userinfo, dynamic client registration and JWKS
    endpoints, and advertises the openid, mcp:read and mcp:write scopes. The protected
    resources behind it — including the MCP surface implied by those scopes — require
    a SiFive customer account.'
  humanURL: https://www.sifive.com/software/sifive-core-designer
