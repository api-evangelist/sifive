x-coverage:
  state: covered
  reason: null
  detail: >-
    SiFive has no public REST API and publishes no OpenAPI — contract discovery probed
    /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /graphql and
    /.well-known/api-catalog on both www.sifive.com and scs.sifive.com and every one
    returned 404. What it does publish was captured: a live RFC 8414 OAuth 2.0
    authorization server on the SiFive Cloud Services portal (whose scopes_supported names
    mcp:read and mcp:write, so an MCP server exists behind the customer login even though
    no MCP endpoint is publicly reachable or documented), the draft-07 DUH hardware-IP
    JSON Schema, the first-party DUH npm/PyPI toolchain, and an ISO/IEC 29147 PSIRT
    disclosure program.
  evidence:
  - url: https://scs.sifive.com/.well-known/oauth-authorization-server
    status: 200
  - url: https://www.sifive.com/psirt-report-vulnerability
    status: 200
  - url: https://www.sifive.com/openapi.json
    status: 404
  - url: https://scs.sifive.com/mcp
    status: 404
  - url: https://www.sifive.com/.well-known/agent-card.json
    status: 404
  checked: '2026-08-05'
